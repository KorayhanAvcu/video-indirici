name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Derle ve test et
        id: build
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease 2>&1 | tee ../build.log

      - name: APK'ları adlandır
        run: |
          mkdir -p dist
          for f in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "dist/VideoIndirici-2.0.${GITHUB_RUN_NUMBER}-${abi}.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: video-indirici-apk
          path: dist/*.apk

      - name: Releases sayfasına koy (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          cat > notes.md <<NOTES
          **Hangi dosyayı indirmeliyim?**
          - Çoğu telefon: \`VideoIndirici-2.0.${GITHUB_RUN_NUMBER}-arm64-v8a.apk\`
          - Emin değilsen: \`...-universal.apk\` (her telefonda çalışır, daha büyük)

          Kurulum: APK'ya dokun → "Bilinmeyen uygulamalara izin ver" → Yükle.
          Yeni sürüm eskisinin üstüne kurulur, indirme listen korunur.

          Derleme: ${GITHUB_SHA::7}
          NOTES
          gh release create android-latest dist/*.apk --target "$GITHUB_SHA" --prerelease \
            --title "Video İndirici Android 2.0.${GITHUB_RUN_NUMBER}" --notes-file notes.md

      - name: Derleme günlüğünü ci-logs dalına yaz
        if: always()
        run: |
          mkdir -p /tmp/logs
          cp build.log /tmp/logs/ 2>/dev/null || echo "build.log yok" > /tmp/logs/build.log
          {
            echo "run=${GITHUB_RUN_NUMBER} sha=${GITHUB_SHA} job=${{ job.status }} build=${{ steps.build.outcome }}"
            ls -la dist 2>&1 || true
          } > /tmp/logs/status.txt
          cp -r android/app/build/test-results /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs
          git init -q
          git checkout -q -b ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "ci ${GITHUB_RUN_NUMBER}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: video-indirici-apk
          path: dist

      - name: Test sitesi dosyaları
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          cd android/ci/site
          mkdir -p akis direct
          ffmpeg -loglevel error -f lavfi -i testsrc=duration=6:size=320x240:rate=10 -f lavfi -i sine=duration=6 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -f hls -hls_time 2 -hls_playlist_type vod \
            -hls_segment_filename 'akis/parca%d.ts' akis/liste.m3u8
          mv akis/liste.m3u8 akis/liste.txt
          ffmpeg -loglevel error -f lavfi -i testsrc=duration=5:size=320x240:rate=10 -f lavfi -i sine=duration=5 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac direct/test.mp4
          npm i --no-save --silent hls.js@1 && cp node_modules/hls.js/dist/hls.min.js .
          ls -la . akis direct

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde uçtan uca deneme
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/ci/smoke.sh

      - name: Sonuçları ci-logs dalına ekle
        if: always()
        run: |
          git clone -q --depth 1 --branch ci-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/logs
          rm -rf /tmp/logs/smoke && mkdir -p /tmp/logs/smoke
          cp -r /tmp/smoke/. /tmp/logs/smoke/ 2>/dev/null || echo "smoke çıktısı yok" > /tmp/logs/smoke/smoke.txt
          echo "smoke run=${GITHUB_RUN_NUMBER} job=${{ job.status }}" > /tmp/logs/smoke/status.txt
          cd /tmp/logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "smoke ${GITHUB_RUN_NUMBER}"
          git push -q origin ci-logs
